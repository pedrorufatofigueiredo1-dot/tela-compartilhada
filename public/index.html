<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salas de Tela</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --accent: #5b8cff;
      --accent-hover: #4472e8;
      --danger: #e5484d;
      --text: #e8e9ec;
      --text-muted: #8b8f99;
      --border: #2a2e37;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Tela de entrada */
    #join-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .join-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .join-card h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }
    .join-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #12141a;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 18px;
    }
    .btn-primary {
      width: 100%;
      margin-top: 24px;
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    #join-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      min-height: 16px;
    }

    /* Tela da sala */
    #room-screen { display: none; min-height: 100vh; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .room-info { font-size: 14px; color: var(--text-muted); }
    header .room-info b { color: var(--text); }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    #share-btn {
      background: var(--accent);
      color: white;
    }
    #share-btn:hover { background: var(--accent-hover); }
    #share-btn.sharing { background: var(--danger); }
    #people-count {
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    #grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      padding: 20px;
      align-content: start;
    }
    .tile {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
    }
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .tile .label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    #empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div id="join-screen">
    <div class="join-card">
      <h1>Entrar em uma sala</h1>
      <p>Crie uma sala nova ou entre em uma já existente. Até 10 pessoas por sala.</p>

      <label for="name-input">Seu nome</label>
      <input id="name-input" type="text" placeholder="Ex: João" maxlength="30" />

      <label for="room-input">Código da sala</label>
      <input id="room-input" type="text" placeholder="Ex: equipe-01" maxlength="40" />

      <button class="btn-primary" id="join-btn">Entrar na sala</button>
      <div id="join-error"></div>
    </div>
  </div>

  <!-- TELA DA SALA -->
  <div id="room-screen">
    <header>
      <div class="room-info">Sala: <b id="room-name-label"></b></div>
      <div class="header-actions">
        <span id="people-count">1 pessoa</span>
        <button id="share-btn">Compartilhar minha tela</button>
      </div>
    </header>
    <div id="grid">
      <div id="empty-state">Ninguém está compartilhando a tela ainda.</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
