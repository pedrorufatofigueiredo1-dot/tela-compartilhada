<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salas de Tela</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --accent: #5b8cff;
      --accent-hover: #4472e8;
      --danger: #e5484d;
      --text: #e8e9ec;
      --text-muted: #8b8f99;
      --border: #2a2e37;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Tela de entrada */
    #join-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .join-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .join-card h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }
    .join-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #12141a;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 18px;
    }
    .btn-primary {
      width: 100%;
      margin-top: 24px;
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    #join-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      min-height: 16px;
    }
    .app-download-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: border-color .15s ease, color .15s ease;
    }
    .app-download-link:hover { border-color: var(--accent); color: var(--text); }
    .app-download-link svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Tela da sala */
    #room-screen { display: none; min-height: 100vh; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .room-info { font-size: 14px; color: var(--text-muted); }
    header .room-info b { color: var(--text); }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    #share-btn {
      background: var(--accent);
      color: white;
    }
    #share-btn:hover { background: var(--accent-hover); }
    #share-btn.sharing { background: var(--danger); }
    #people-count {
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    #quality-select {
      background: #12141a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      padding: 8px 10px;
      cursor: pointer;
    }
    #quality-select:disabled { opacity: .5; cursor: not-allowed; }

    #grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 480px));
      justify-content: center;
      gap: 16px;
      padding: 20px;
      align-content: start;
    }
    .tile {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .tile:hover {
      border-color: #3a3f4c;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
    }
    .tile:fullscreen,
    .tile:-webkit-full-screen {
      aspect-ratio: unset;
      border-radius: 0;
      background: #000;
    }
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Overlay com nome + barra de controles */
    .tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .tile .name-tag {
      pointer-events: none;
      align-self: flex-start;
      margin: 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
    }

    .controls-bar {
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 10px 10px;
      padding: 6px 8px;
      background: rgba(15,17,21,0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .tile:hover .controls-bar,
    .tile.controls-pinned .controls-bar {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
    }
    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      padding: 0;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
    .ctrl-btn.active { color: var(--accent); }
    .ctrl-btn svg { width: 17px; height: 17px; }
    .volume-slider {
      flex: 1;
      min-width: 40px;
      accent-color: var(--accent);
      height: 16px;
      padding: 0;
      background: transparent;
    }
    .volume-value {
      width: 34px;
      flex-shrink: 0;
      text-align: right;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    #empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div id="join-screen">
    <div class="join-card">
      <h1>Entrar em uma sala</h1>
      <p>Crie uma sala nova ou entre em uma já existente. Até 10 pessoas por sala.</p>

      <label for="name-input">Seu nome</label>
      <input id="name-input" type="text" placeholder="Ex: João" maxlength="30" />

      <label for="room-input">Código da sala</label>
      <input id="room-input" type="text" placeholder="Ex: equipe-01" maxlength="40" />

      <button class="btn-primary" id="join-btn">Entrar na sala</button>
      <div id="join-error"></div>

      <a class="app-download-link" href="https://github.com/pedrorufatofigueiredo1-dot/tela-compartilhada/releases/download/app-v1.0.0/Tela.Compartilhada.Setup.1.0.0.exe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Baixar o app para Windows
      </a>
    </div>
  </div>

  <!-- TELA DA SALA -->
  <div id="room-screen">
    <header>
      <div class="room-info">Sala: <b id="room-name-label"></b></div>
      <div class="header-actions">
        <span id="people-count">1 pessoa</span>
        <select id="quality-select" title="Qualidade da sua transmissão">
          <option value="low">Qualidade: Leve</option>
          <option value="medium">Qualidade: Média</option>
          <option value="high" selected>Qualidade: Alta</option>
        </select>
        <button id="share-btn">Compartilhar minha tela</button>
      </div>
    </header>
    <div id="grid">
      <div id="empty-state">Ninguém está compartilhando a tela ainda.</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
